name: Schermate UI

# Fotografie della UI con dati sintetici (Robolectric, grafica nativa): per controllare
# il design senza un telefono. Gira sui branch di lavoro e a richiesta, non su main.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: "Classi di test (pattern --tests)"
        default: "*Shot*"
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Installa piattaforma Android
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' > /dev/null
      - name: Schermate
        env:
          MITHRIL_SCREENSHOTS: "1"
        run: ./gradlew testDebugUnitTest --tests "${{ inputs.filter || '*Shot*' }}" --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: |
            app/build/reports/screenshots/
            app/build/reports/tests/
