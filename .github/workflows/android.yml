name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Compilazione, test, lint e rilascio
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Installa piattaforma Android
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;35.0.0' > /dev/null
      - name: Compila, testa e verifica
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --no-daemon 2>&1 | tee gradle-build.log
      - name: Riassumi gli errori
        if: failure()
        shell: python
        run: |
          import glob, re
          from pathlib import Path
          lines = Path('gradle-build.log').read_text(errors='replace').splitlines() if Path('gradle-build.log').exists() else []
          picked = []
          for i, line in enumerate(lines):
              if re.match(r'^(e: |\* What went wrong|FAILURE|.*FAILED$|.*Error:)', line) or 'error:' in line:
                  picked.extend(lines[i:i + 3] if 'went wrong' in line else [line])
          for xml in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              for m in re.finditer(r'<testcase name="([^"]+)"[^>]*>\s*<failure message="([^"]*)"', Path(xml).read_text(errors='replace')):
                  picked.append('TEST ' + m[1] + ': ' + m[2][:500])
          text = '\n'.join(dict.fromkeys(picked))[:60000] or 'Nessun errore riconosciuto nel log.'
          print(text)
          print('::error title=Errori di compilazione::' + text.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
      - name: Conserva APK e rapporti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mithril-build-${{ github.sha }}
          path: |
            app/build/outputs/apk/
            app/build/reports/
            app/build/test-results/
          retention-days: 30
      - name: Firma e pubblica la nuova versione
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          UPDATE_PRIVATE_KEY_PEM: ${{ secrets.UPDATE_PRIVATE_KEY_PEM }}
        run: python3 scripts/publish_release.py
